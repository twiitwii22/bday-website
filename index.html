  #page2 { display: none; }
  #page2 img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* ---------- Page 1 ---------- */
  .stage { position: absolute; inset: 0; }

  .title-arc {
    position: absolute; left: 50%;
    top: calc(48% - min(44vh, 72vw) / 2 + 4vh);
    width: min(66vh, 92vw); transform: translate(-50%, -100%);
    pointer-events: none; z-index: 1;
  }
  .title-arc text { font-family: "Lexend", system-ui, sans-serif; font-weight: 600; fill: var(--rose); letter-spacing: .5px; }

  /* wobble wrapper (position + gentle float) -> scale wrapper -> image */
  #balloonWrap {
    --bsize: min(44vh, 72vw);
    position: absolute; left: 50%; top: 48%;
    width: var(--bsize); height: var(--bsize);
    margin-left: calc(var(--bsize) / -2); margin-top: calc(var(--bsize) / -2);
    animation: float 4.6s ease-in-out infinite;
    will-change: transform; z-index: 3; cursor: pointer; touch-action: none;
  }
  @keyframes float {
    0%   { transform: translate(0, 0) rotate(-2.2deg); }
    25%  { transform: translate(1.2vmin, -1.6vmin) rotate(0.6deg); }
    50%  { transform: translate(0, -2.4vmin) rotate(2.2deg); }
    75%  { transform: translate(-1.2vmin, -1.2vmin) rotate(-0.4deg); }
    100% { transform: translate(0, 0) rotate(-2.2deg); }
  }
  #balloonScale { position: absolute; inset: 0; transform-origin: 50% 54%; will-change: transform; }
  #balloonScale img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 .8vmin 1.4vmin rgba(181,100,111,.22)); }

  /* meter */
  #meterBox {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
    transform: translateX(-50%); width: min(260px, 52vw); z-index: 6; text-align: center;
  }
  #meter {
    height: 14px; border-radius: 999px; padding: 2px;
    background: rgba(255,255,255,.78); border: 1.5px solid #f1c0cc;
    box-shadow: 0 2px 10px rgba(242,169,187,.35);
  }
  #meterFill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--pink-pale), var(--pink));
    transition: none;
  }
  #hint {
    margin-top: 10px; font-size: clamp(11px, 1.5vh + 4px, 14px); font-weight: 500; color: var(--rose);
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    background: rgba(255,255,255,.72); min-height: 1.3em;
  }
  #hint button {
    font: inherit; color: var(--rose); background: rgba(255,255,255,.75); border: 1.5px solid #f1c0cc;
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }

  /* flash + confetti */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
</style>

<div id="flash"></div>
<canvas id="confetti"></canvas>

<script>
(() => {
  "use strict";

  /* =====================================================
     SETTINGS
     ===================================================== */
  const BLOWS_TO_FILL   = 7.5;   // ~7-8 full blows fill the balloon
  const BLOW_SECONDS    = 1.4;   // length of one "full" blow (extra length within one breath is ignored)
  const GAP_TOLERANCE   = 0.22;  // seconds of silence still counted as the same breath
  const ON_MARGIN       = 3.2;   // blow starts when low-band level > noise floor * this
  const OFF_MARGIN      = 2.0;   // ...and stops when it drops below noise floor * this
  const MIN_ON_LEVEL    = 0.012; // absolute minimum level so a silent room doesn't trigger

  /* =====================================================
     ELEMENTS
     ===================================================== */
  const $ = (id) => document.getElementById(id);
  const page1 = $("page1"), page2 = $("page2");
  const wrap = $("balloonWrap"), scaleEl = $("balloonScale");
  const meterFill = $("meterFill"), meter = $("meter"), hint = $("hint");
  const flash = $("flash");

  /* =====================================================
     STATE
     ===================================================== */
  let progress = 0;          // 0..1 (true)
  let shown = 0;             // smoothed progress used for drawing
  let burst = false;
  let breathTime = 0;        // seconds of blowing in the current breath
  let sinceBlow = 99;        // seconds since last blowing frame
  let micBlowing = false, holdBlowing = false, keyBlowing = false;
  let micReady = false, micFailed = false;
  let level = 0, floor = 0.004, blowing = false;
  let lastT = performance.now();

  /* =====================================================
     MICROPHONE (Web Audio API) -- blow detection
     ===================================================== */
  let audioCtx = null, analyser = null, buf = null, micStream = null, starting = false;

  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }

  async function startMic() {
    if (starting || micReady || burst) return;
    starting = true;
    try {
      const ctx = getCtx();
      if (!ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("unsupported");
      micStream = await navigator.mediaDevices.getUserMedia({
        // Noise suppression & auto-gain would "clean away" the blowing sound, so turn them off.
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      if (ctx.state === "suspended") await ctx.resume();
      const src = ctx.createMediaStreamSource(micStream);

      // Wind noise from blowing is mostly low-frequency rumble. Low-pass so voices/claps matter less.
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = 0.5;
      const hp = ctx.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 20;

      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
      src.connect(hp); hp.connect(lp); lp.connect(analyser);   // not connected to speakers (no feedback)

      micReady = true; micFailed = false;
      calibrateUntil = performance.now() + 700;
      floor = 0.004; floorSeeded = false;
      setHint();
    } catch (e) {
      micFailed = true; micReady = false;
      setHint();
    } finally {
      starting = false;
    }
  }

  let calibrateUntil = 0, floorSeeded = false;

  function readMic(dt) {
    if (!micReady || !analyser) { micBlowing = false; return; }
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);

    // fast attack, slower release -> steady reading of a breath
    level = rms > level ? level + (rms - level) * 0.6 : level + (rms - level) * 0.12;

    const now = performance.now();
    if (now < calibrateUntil) {                       // measure room noise at start
      floor = floorSeeded ? Math.max(floor * 0.9 + level * 0.1, 0.0015) : Math.max(level, 0.0015);
      floorSeeded = true;
      micBlowing = false; return;
    }
    const onT  = Math.max(floor * ON_MARGIN,  MIN_ON_LEVEL);
    const offT = Math.max(floor * OFF_MARGIN, MIN_ON_LEVEL * 0.6);
    if (!blowing && level > onT) blowing = true;
    else if (blowing && level < offT) blowing = false;

    // slowly track the room noise when nobody is blowing
    if (!blowing) floor += (Math.min(level, 0.03) - floor) * Math.min(1, dt * 0.4);
    micBlowing = blowing;
  }

  function setHint(extra) {
    if (burst) { hint.textContent = ""; hint.style.display = "none"; return; }
    if (extra) { hint.textContent = extra; return; }
    if (micFailed) {
      hint.innerHTML = "no mic \u2014 press &amp; hold the balloon";
    } else if (!micReady) {
      hint.innerHTML = '<button type="button" id="micBtn">enable microphone</button>';
      const b = $("micBtn"); if (b) b.addEventListener("click", (e) => { e.stopPropagation(); startMic(); });
    } else {
      hint.textContent = "blow into your mic";
    }
  }

  /* =====================================================
     FALLBACK INPUT: press & hold the balloon (or Space)
     ===================================================== */
  wrap.addEventListener("pointerdown", (e) => { holdBlowing = true; try { wrap.setPointerCapture(e.pointerId); } catch (_) {} });
  const endHold = () => { holdBlowing = false; };
  wrap.addEventListener("pointerup", endHold);
  wrap.addEventListener("pointercancel", endHold);
  wrap.addEventListener("lostpointercapture", endHold);
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); keyBlowing = true; } });
  window.addEventListener("keyup",   (e) => { if (e.code === "Space") keyBlowing = false; });

  // Browsers want a user gesture before audio can start; try on load, and again on first touch.
  window.addEventListener("pointerdown", () => {
    const ctx = getCtx(); if (ctx && ctx.state === "suspended") ctx.resume();
    if (!micReady && !micFailed) startMic();
  }, { once: false });

  /* =====================================================
     BALLOON SIZE
     The balloon grows from its resting size until it covers the whole viewport.
     ===================================================== */
  function coverScale() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const size = Math.min(vh * 0.44, vw * 0.72);
    const cx = vw / 2, cy = vh * 0.48 + (0.54 - 0.5) * 0 ;
    // farthest corner from the balloon's scaling origin
    const ox = cx, oy = cy + size * 0.04;
    const far = Math.max(
      Math.hypot(ox, oy), Math.hypot(vw - ox, oy),
      Math.hypot(ox, vh - oy), Math.hypot(vw - ox, vh - oy)
    );
    // the star's solid core (measured from the image) reaches ~0.31 of its size from the centre in every direction
    return (far * 1.12) / (size * 0.2);
  }

  function applyBalloon(p, t) {
    const target = coverScale();
    // geometric growth: every blow makes the balloon the same *proportion* bigger
    let s = Math.pow(target, Math.pow(p, 1.7));
    // little "breathing" pulse while inflating
    const pulse = (blowingNow ? 0.018 : 0.006) * Math.sin(t * 0.014);
    s *= 1 + pulse;
    scaleEl.style.transform = "scale(" + s.toFixed(4) + ")";
    // wobble a bit faster while it fills
    wrap.style.animationDuration = (4.6 - Math.min(p, 1) * 2.2).toFixed(2) + "s";
  }

  /* =====================================================
     MAIN LOOP
     ===================================================== */
  let blowingNow = false;

  function frame(now) {
    const dt = Math.min(0.2, (now - lastT) / 1000);
    lastT = now;

    if (!burst) {
      readMic(dt);
      blowingNow = micBlowing || holdBlowing || keyBlowing;

      if (blowingNow) {
        if (sinceBlow > GAP_TOLERANCE) breathTime = 0;   // a new breath begins
        sinceBlow = 0;
        // each breath can contribute at most BLOW_SECONDS' worth of inflation
        if (breathTime < BLOW_SECONDS) {
          const add = Math.min(dt, BLOW_SECONDS - breathTime);
          breathTime += add;
          progress = Math.min(1, progress + add / BLOW_SECONDS / BLOWS_TO_FILL);
        }
      } else {
        sinceBlow += dt;
      }

      shown += (progress - shown) * Math.min(1, dt * 8);
      meterFill.style.width = (shown * 100).toFixed(1) + "%";
      meter.setAttribute("aria-valuenow", Math.round(shown * 100));
      applyBalloon(shown, now);

      if (progress >= 1 && shown > 0.985) doBurst();
    }
    Confetti.step(dt);
    requestAnimationFrame(frame);
  }

  /* =====================================================
     BURST -> PAGE 2
     ===================================================== */
  function popSound() {
    const ctx = getCtx(); if (!ctx) return;
    try {
      if (ctx.state === "suspended") ctx.resume();
      const len = Math.floor(ctx.sampleRate * 0.35);
      const b = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
      const src = ctx.createBufferSource(); src.buffer = b;
      const g = ctx.createGain(); g.gain.value = 0.9;
      src.connect(g); g.connect(ctx.destination); src.start();
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(220, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.12);
      og.gain.setValueAtTime(0.6, ctx.currentTime); og.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
      o.connect(og); og.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.15);
    } catch (_) {}
  }

  function doBurst() {
    burst = true;
    setHint();
    // stop listening
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    micReady = false;

    popSound();
    scaleEl.style.transition = "transform 90ms ease-out";
    scaleEl.style.transform += " scale(1.08)";

    flash.style.transition = "opacity 90ms ease-out";
    flash.style.opacity = "1";

    setTimeout(() => {
      page1.style.display = "none";
      page2.style.display = "block";
      document.title = "Happy Birthday!";
      Confetti.bigBurst();
      flash.style.transition = "opacity 550ms ease-in";
      flash.style.opacity = "0";
      setTimeout(() => Confetti.startRain(), 600);
    }, 110);
  }

  // Tap anywhere on page 2 for an extra little burst
  page2.addEventListener("pointerdown", (e) => Confetti.pop(e.clientX, e.clientY, 70));

  /* =====================================================
     CONFETTI (pink + silver + cream + strawberry red)
     ===================================================== */
  const Confetti = (() => {
    const cv = $("confetti"), cx = cv.getContext("2d");
    let W = 0, H = 0, dpr = 1;
    const parts = [];
    let raining = false, rainAcc = 0;
    const COLORS = ["#f8cdd7", "#f2a9bb", "#e98aa3", "#ffd9e2", "#ff8fab", "#f7b5c5", "#ec7f9b",
                    "#d9d9de", "#bfc0c6", "#9c9da4", "#e4474f"];

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize); resize();

    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];

    function make(x, y, vx, vy) {
      const shape = pick(["rect", "rect", "rect", "circle", "star", "strip"]);
      const size = rnd(7, 14) * Math.min(1.4, Math.max(0.8, W / 1100));
      parts.push({
        x, y, vx, vy, shape, size,
        color: pick(COLORS),
        rot: rnd(0, Math.PI * 2), vr: rnd(-7, 7),
        flip: rnd(0, Math.PI * 2), vf: rnd(4, 11),
        drag: rnd(1.6, 3.0), g: rnd(380, 520),
        sway: rnd(10, 40), swayF: rnd(1.5, 4), phase: rnd(0, 6.28), age: 0
      });
    }

    function pop(x, y, n, spread) {
      for (let i = 0; i < n; i++) {
        const a = rnd(0, Math.PI * 2), sp = rnd(250, 1100) * (spread || 1);
        make(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 150);
      }
    }
    function cannon(x, y, angle, n) {
      for (let i = 0; i < n; i++) {
        const a = angle + rnd(-0.28, 0.28), sp = rnd(700, 1700);
        make(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
      }
    }
    function bigBurst() {
      pop(W / 2, H * 0.48, 260, 1.25);
      cannon(0, H, -Math.PI / 3, 120);
      cannon(W, H, -2 * Math.PI / 3, 120);
      setTimeout(() => { pop(W * 0.3, H * 0.35, 90); pop(W * 0.7, H * 0.35, 90); }, 260);
      setTimeout(() => { cannon(0, H * 0.9, -Math.PI / 4, 70); cannon(W, H * 0.9, -3 * Math.PI / 4, 70); }, 520);
    }
    function startRain() { raining = true; }

    function drawStar(r) {
      cx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 ? r * 0.45 : r, a = (Math.PI / 5) * i - Math.PI / 2;
        cx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      cx.closePath(); cx.fill();
    }

    function step(dt) {
      if (raining) {
        rainAcc += dt * 85 * Math.min(1.6, Math.max(0.6, W / 1200));   // ~85 pieces/sec
        while (rainAcc >= 1) { rainAcc--; make(rnd(-20, W + 20), -20, rnd(-40, 40), rnd(40, 200)); }
      }
      cx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        p.vy += p.g * dt;
        const damp = Math.exp(-p.drag * dt);
        p.vx *= damp; p.vy *= damp;
        p.x += (p.vx + Math.sin(p.age * p.swayF + p.phase) * p.sway) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt; p.flip += p.vf * dt;
        if (p.y > H + 40 || p.x < -80 || p.x > W + 80) { parts.splice(i, 1); continue; }

        cx.save();
        cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.fillStyle = p.color;
        const f = Math.cos(p.flip);                       // fake 3D flutter
        cx.scale(1, f);
        const s = p.size;
        if (p.shape === "rect") cx.fillRect(-s / 2, -s * 0.35, s, s * 0.7);
        else if (p.shape === "strip") cx.fillRect(-s * 0.18, -s * 0.9, s * 0.36, s * 1.8);
        else if (p.shape === "circle") { cx.beginPath(); cx.arc(0, 0, s * 0.42, 0, 6.2832); cx.fill(); }
        else drawStar(s * 0.65);
        cx.restore();
      }
      if (parts.length > 1400) parts.splice(0, parts.length - 1400);
    }
    return { step, bigBurst, startRain, pop };
  })();

  /* =====================================================
     GO
     ===================================================== */
  setHint();
  startMic();                       // shows the browser's permission prompt right away
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body>
